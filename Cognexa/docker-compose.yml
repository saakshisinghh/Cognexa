version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: indusmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: indusmind
      POSTGRES_PASSWORD: indusmind
      POSTGRES_DB: indusmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indusmind -d indusmind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - indusmind_net

  # ─── Weaviate ────────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.25.4
    container_name: indusmind_weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      ENABLE_MODULES: ""
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - indusmind_net

  # ─── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: indusmind_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - indusmind_net

  # ─── Redis (Celery broker + result backend) ──────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: indusmind_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - indusmind_net

  # ─── Neo4j (Knowledge Graph) ──────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.23-community
    container_name: indusmind_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/indusmind
      NEO4J_dbms_memory_pagecache_size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - indusmind_net

  # ─── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: indusmind_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://indusmind:indusmind@postgres:5432/indusmind
      WEAVIATE_URL: http://weaviate:8080
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: indusmind
    # Copilot + Agents/Workflow call apps/api/services/llm_gateway.py, whose
    # default OPENAI_BASE_URL is http://host.docker.internal:11434/v1
    # (local Ollama). host.docker.internal resolves automatically on Docker
    # Desktop (Mac/Windows) but NOT on plain Docker Engine on Linux unless
    # mapped explicitly — without this, every LLM call from inside this
    # container fails with a connection error.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - model_cache:/home/indusmind/.cache
    networks:
      - indusmind_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # ─── Celery Worker ────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: indusmind_celery_worker
    restart: unless-stopped
    # FIX: queue list now matches apps/api/workers/celery_app.py's actual
    # task_routes — documents, ocr, embedding, cleanup, default, graph
    # (Phase 3), plus temporal, gap, loss, disagreement (Phase 6). Without
    # these, tasks like `temporal_tasks.recompute_trust_scores` or
    # `disagreement_tasks.detect_expert_disagreements` get published to
    # Redis by celery beat every night and just sit there forever —
    # no error, no crash, they simply never run.
    command: >
      celery -A apps.api.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      -Q documents,ocr,embedding,cleanup,default,graph,temporal,gap,loss,disagreement
      -n worker@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://indusmind:indusmind@postgres:5432/indusmind
      WEAVIATE_URL: http://weaviate:8080
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - model_cache:/home/indusmind/.cache
    networks:
      - indusmind_net
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.api.workers.celery_app inspect ping -d worker@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ─── Celery Beat (scheduler for cleanup / recovery / metrics tasks) ──────────
  celery_beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: indusmind_celery_beat
    restart: unless-stopped
    command: celery -A apps.api.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://indusmind:indusmind@postgres:5432/indusmind
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - indusmind_net
    # FIX (issue #7 — "Celery Beat container is unhealthy"):
    # This service is built from apps/api/Dockerfile, whose baked-in
    # HEALTHCHECK runs `curl -f http://localhost:8000/api/health`, which
    # only exists on the FastAPI `api` service. `celery beat` doesn't serve
    # HTTP at all, so it silently inherited that broken check (celery_worker
    # below already overrides it with `inspect ping`; beat had no override).
    # `beat` has nothing to probe over HTTP, so instead confirm the beat
    # process is running and has written its schedule file.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Flower (Celery monitoring UI, optional) ─────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: indusmind_flower
    restart: unless-stopped
    command: celery -A apps.api.workers.celery_app flower --port=5555
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - indusmind_net
    profiles:
      - tools

  # ─── Redis Commander (optional Redis GUI) ────────────────────────────────────
  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: indusmind_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - indusmind_net
    profiles:
      - tools

  # ─── Next.js Frontend ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: indusmind_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_API_URL is inlined into the CLIENT bundle and used by
      # the browser, which reaches the API via the published host port.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # FIX (issue #8 / Copilot+Graph "doesn't work"): next.config.js's
      # server-side rewrites() also read NEXT_PUBLIC_API_URL, but those
      # rewrites run inside the Next.js server INSIDE this container —
      # "http://localhost:8000" there is this same container, not `api`,
      # so every relative-path request (/api/v1/copilot/v2/*,
      # /api/v1/graph/*, /api/v1/incidents/*, and the /api/health proxy the
      # Dockerfile healthcheck used) failed with a connection error.
      # INTERNAL_API_URL gives the server-side rewrite the right address.
      INTERNAL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - indusmind_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    name: indusmind_postgres_data
  weaviate_data:
    name: indusmind_weaviate_data
  minio_data:
    name: indusmind_minio_data
  model_cache:
    name: indusmind_model_cache
  redis_data:
    name: indusmind_redis_data
  neo4j_data:
    name: indusmind_neo4j_data

networks:
  indusmind_net:
    name: indusmind_network
    driver: bridge