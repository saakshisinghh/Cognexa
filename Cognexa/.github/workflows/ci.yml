name: INDUS MIND CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Python API Lint & Test ──────────────────────────────────────────────────
  api-lint:
    name: API — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy types-PyYAML
          pip install -r apps/api/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 apps/api/ \
            --max-line-length=120 \
            --exclude=__pycache__,migrations \
            --ignore=E501,W503

  api-test:
    name: API — Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: indusmind
          POSTGRES_PASSWORD: indusmind
          POSTGRES_DB: indusmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://indusmind:indusmind@localhost:5432/indusmind_test
          SECRET_KEY: test-secret-key-ci-only-not-for-production
          WEAVIATE_URL: http://localhost:8080
          MINIO_ENDPOINT: localhost:9000
          OPENAI_API_KEY: sk-test
        run: |
          cd $GITHUB_WORKSPACE
          python -m pytest apps/api/tests/ -v --tb=short --co -q 2>/dev/null || echo "No tests found yet"

  # ─── Next.js Frontend ─────────────────────────────────────────────────────────
  web-lint:
    name: Web — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: TypeScript type check
        working-directory: apps/web
        run: npm run type-check

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

  web-build:
    name: Web — Build
    runs-on: ubuntu-latest
    needs: web-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Build Next.js
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ─── Docker Build Validation ─────────────────────────────────────────────────
  docker-validate:
    name: Docker — Build Validation
    runs-on: ubuntu-latest
    needs: [api-lint, web-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate API Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: indusmind-api:ci

      - name: Validate Web Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: indusmind-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
